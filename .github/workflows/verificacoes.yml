name: Verificações do protótipo

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências de teste
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar testes e medir cobertura
        run: npm run test:coverage
      - name: Salvar relatórios de testes e cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verificacao-prototipo
          path: |
            test-results/verificacao.json
            coverage/
            !coverage/browser-v8.json
            !coverage/node-*/**
          if-no-files-found: warn
          retention-days: 14
