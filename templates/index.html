{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OFF Nutrition Lab | Pedidos</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <script src="{% static 'order-rules.js' %}" defer></script>
  <script src="{% static 'app.js' %}" defer></script>
</head>
<body>
<form id="logout-form" method="post" action="{% url 'logout' %}" hidden>{% csrf_token %}</form>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <aside class="sidebar" aria-label="Navegação principal">
    <a class="brand" href="#pedidos" aria-label="OFF Nutrition Lab, início"><strong>OFF<span aria-hidden="true">●</span></strong><small>NUTRITION LAB</small></a>
    <div class="sidebar-label">OPERAÇÃO</div>
    <nav>
      <a class="nav-item active" href="#pedidos"><span aria-hidden="true">▤</span> Pedidos <span class="nav-count" id="order-count">0</span></a>
      <button class="nav-item" data-dialog="produtos"><span aria-hidden="true">▣</span> Produtos</button>
      <button class="nav-item" data-dialog="duvidas"><span aria-hidden="true">?</span> Dúvidas frequentes</button>
    </nav>
    <div class="sidebar-bottom"><div class="avatar" aria-hidden="true">OF</div><div><b>Equipe OFF</b><small>{{ request.user.username }}</small></div><button id="sair" class="icon-button" aria-label="Sair">↗</button></div>
  </aside>
  <main id="conteudo" tabindex="-1">
    <header class="topbar"><span>OFF NUTRITION LAB <span class="separator">/</span> GESTÃO DE PEDIDOS</span><span class="demo-tag"><i aria-hidden="true"></i> Estoque central</span></header>
    <div id="app"></div>
    <footer class="app-footer"><span>OFF Nutrition Lab · Pedidos e estoque</span><a class="button" href="/admin/">Administração</a></footer>
  </main>
  <dialog id="aux-dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="fechar-dialog" class="icon-button" aria-label="Fechar">×</button></div><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
</body>
</html>
