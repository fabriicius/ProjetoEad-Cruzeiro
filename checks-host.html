<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Verificação do protótipo</title></head><body><script>
const width=Number(new URLSearchParams(location.search).get('width'))||320;
const frame=document.createElement('iframe');frame.width=width;frame.height=1000;frame.style.border='0';frame.src='index.html?captura=1&teste=1';document.body.appendChild(frame);
const timer=setInterval(()=>{const result=frame.contentWindow?.OFF_CHECKS;if(result){clearInterval(timer);const pre=document.createElement('pre');pre.id='test-results';pre.textContent=JSON.stringify(result);document.body.appendChild(pre);}},100);
</script></body></html>
